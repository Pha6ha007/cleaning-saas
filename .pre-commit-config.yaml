# Pre-commit hooks for Proof Platform
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '.*\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in GitHub Actions
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=100']
        files: ^backend/

  # Python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: ^backend/

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=100'
          - '--extend-ignore=E203,W503'  # Black compatibility
          - '--exclude=migrations,__pycache__,venv,env,.venv'
        files: ^backend/

  # Security: Bandit (Python security linter)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'backend/.bandit', '-r', 'backend/apps/']
        pass_filenames: false

  # Security: Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.*_test\.py$|.*\.lock$'

  # Django checks
  - repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: bash -c 'cd backend && python manage.py check --deploy --fail-level WARNING'
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]

      - id: django-migrations
        name: Check for missing migrations
        entry: bash -c 'cd backend && python manage.py makemigrations --check --dry-run --no-input'
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]

  # Security tests (run on push only, not on commit)
  - repo: local
    hooks:
      - id: security-tests
        name: Run security tests
        entry: bash -c 'cd backend && pytest tests/security/ -v --tb=short'
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]

# Default stages (commit, merge-commit, push, manual)
default_stages: [commit]

# Configuration
fail_fast: false
