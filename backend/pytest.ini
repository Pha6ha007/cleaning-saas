# Pytest Configuration for Proof Platform

[pytest]
# Django settings module
DJANGO_SETTINGS_MODULE = config.settings

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Paths to search for tests
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (all markers must be registered)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Show warnings
    -W default
    # Coverage options (commented out by default, uncomment to enable)
    # --cov=apps
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-branch
    # Fail if coverage is below threshold
    # --cov-fail-under=80

# Markers for test categorization
markers =
    django_db: Tests that require database access
    slow: Tests that are slow to run
    security: Security-related tests
    integration: Integration tests
    unit: Unit tests
    smoke: Smoke tests for basic functionality
    regression: Regression tests
    performance: Performance tests

# Django-specific settings
django_find_project = false

# Ignore directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    migrations
    venv
    env
    .venv
    node_modules

# Minimum Python version
minversion = 3.11

# Console output encoding
console_output_style = progress

# Timeout for tests (in seconds)
# Requires pytest-timeout plugin
# timeout = 300

# Parallel execution (requires pytest-xdist)
# Uncomment to enable parallel test execution
# addopts = -n auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture settings
capture = no

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Filterwarnings (suppress known warnings)
filterwarnings =
    # Ignore deprecation warnings from dependencies
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Turn our own warnings into errors
    error::UserWarning:apps.*
