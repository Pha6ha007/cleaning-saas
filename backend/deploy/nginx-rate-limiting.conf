# =============================================================================
# Nginx Rate Limiting Configuration for Proof Platform
# =============================================================================
#
# Place in /etc/nginx/conf.d/rate-limiting.conf
# or include from your main server block.
#
# This provides L7 rate limiting BEFORE requests reach Django/Gunicorn,
# protecting against volumetric abuse, credential stuffing, and DDoS.
#
# DRF throttles (apps/api/throttles.py) handle per-user/per-scope limits.
# Nginx handles per-IP limits at the infrastructure level.
# =============================================================================

# --- Rate limit zones (shared memory) ---

# General API: 30 requests/second per IP (burst 50)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Auth endpoints: 5 requests/minute per IP (strict — prevents brute force)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

# Signup: 3 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api_signup:10m rate=3r/m;

# Webhook (Paddle): 20 requests/second per IP (Paddle sends bursts)
limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=20r/s;

# File uploads (photos): 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;


# --- Apply in server block ---
