# nginx/conf.d/cleanproof.conf
#
# CleanProof Production Nginx Config
#
# Prerequisites:
#   1. SSL cert at /etc/nginx/certs/cleanproof.crt + cleanproof.key
#      (or use Let's Encrypt: certbot --nginx -d app.cleanproof.com)
#   2. Adjust `server_name` to your domain
#
# Static files are served directly by nginx from the Docker volume.
# API requests are proxied to the Django Gunicorn backend on port 8000.
#

# Rate limiting zones (applied per IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream backend pool
upstream django {
    server backend:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name app.cleanproof.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    http2 on;
    server_name app.cleanproof.com;

    # TLS configuration
    ssl_certificate     /etc/nginx/certs/cleanproof.crt;
    ssl_certificate_key /etc/nginx/certs/cleanproof.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Client body size (for photo uploads — match Django MAX_UPLOAD_SIZE)
    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # Static files — served directly by nginx (fast, no Django involved)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Media files — user uploads (photos, PDFs, logos)
    # -------------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Security: prevent execution of uploaded files
        types { }
        default_type application/octet-stream;
    }

    # -------------------------------------------------------------------------
    # Health probe — no rate limiting, allow load balancers
    # -------------------------------------------------------------------------
    location = /api/health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Login endpoint — strict rate limiting
    # -------------------------------------------------------------------------
    location ~ ^/api/(manager|cleaner)/auth/(login|token)/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # API — all other endpoints
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Keep-alive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -------------------------------------------------------------------------
    # Django Admin — restrict to internal IPs in production (uncomment)
    # -------------------------------------------------------------------------
    location /admin/ {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Frontend SPA (React) — served from Vercel, not nginx
    # If self-hosting the frontend, serve from /var/www/frontend:
    # -------------------------------------------------------------------------
    # location / {
    #     root /var/www/frontend;
    #     try_files $uri $uri/ /index.html;
    #     expires 10m;
    # }

    # Block dot files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
