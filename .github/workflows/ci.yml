name: CI

on:
  push:
    branches: [ main, develop, 'milestone/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: full test suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    defaults:
      run:
        working-directory: ./backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Check migrations are up to date
        run: |
          python manage.py migrate --check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///ci_test.db
          REDIS_URL: redis://localhost:6379/0

      - name: Run full test suite
        run: |
          pytest tests/ --ignore=tests/e2e \
            -q --no-header \
            --tb=short \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -x
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///ci_test.db
          REDIS_URL: redis://localhost:6379/0

      - name: Run E2E API flow tests
        run: |
          playwright install chromium --with-deps
          pytest tests/e2e/ -q --no-header --tb=short
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///ci_test.db
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: backend-tests
          name: backend-coverage

  # ---------------------------------------------------------------------------
  # Frontend: type check + build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dubai-control

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dubai-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Use placeholder values — build should not fail on missing env vars
          VITE_API_URL: https://api.cleanproof.com
          VITE_PADDLE_CLIENT_TOKEN: test_paddle_token

      - name: Check chunk sizes
        run: |
          # Fail if any JS chunk exceeds 550KB (threshold from vite.config.ts)
          node -e "
          const fs = require('fs');
          const path = require('path');
          const assetsDir = 'dist/assets';
          const files = fs.readdirSync(assetsDir).filter(f => f.endsWith('.js'));
          let fail = false;
          for (const f of files) {
            const size = fs.statSync(path.join(assetsDir, f)).size;
            const kb = (size / 1024).toFixed(1);
            if (size > 550 * 1024) {
              console.error('FAIL chunk too large: ' + f + ' (' + kb + ' kB)');
              fail = true;
            }
          }
          if (fail) process.exit(1);
          console.log('All chunks within size limit.');
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dubai-control/dist/
          retention-days: 7


  # ---------------------------------------------------------------------------
  # Frontend: Playwright E2E smoke tests (no backend required)
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dubai-control

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dubai-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dubai-control/playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Mobile: Jest tests
  # ---------------------------------------------------------------------------
  mobile-tests:
    name: Mobile Jest Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile-cleaner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-cleaner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npx jest --no-coverage --ci

  # ---------------------------------------------------------------------------
  # Gate: all checks must pass
  # ---------------------------------------------------------------------------
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, frontend-e2e, mobile-tests]
    if: always()

    steps:
      - name: Verify all jobs succeeded
        run: |
          backend="${{ needs.backend-tests.result }}"
          frontend="${{ needs.frontend-build.result }}"
          e2e="${{ needs.frontend-e2e.result }}"
          mobile="${{ needs.mobile-tests.result }}"

          echo "backend-tests:   $backend"
          echo "frontend-build:  $frontend"
          echo "frontend-e2e:    $e2e"
          echo "mobile-tests:    $mobile"

          if [ "$backend" != "success" ] || \
             [ "$frontend" != "success" ] || \
             [ "$e2e" != "success" ] || \
             [ "$mobile" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
