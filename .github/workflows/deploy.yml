name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      run_migrations:
        description: 'Run database migrations'
        required: true
        default: true
        type: boolean

# Only one deploy at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CI passed
        run: |
          echo "Deploying commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/cleanproof

            echo "=== Pulling latest code ==="
            git fetch origin
            git checkout ${{ github.sha }}

            echo "=== Pulling Docker images ==="
            docker compose pull db redis

            echo "=== Building application images ==="
            docker compose build --no-cache backend celery-worker celery-beat

            echo "=== Running migrations ==="
            if [ "${{ github.event.inputs.run_migrations }}" = "true" ]; then
              docker compose run --rm backend python manage.py migrate --noinput
            fi

            echo "=== Collecting static files ==="
            docker compose run --rm backend python manage.py collectstatic --noinput

            echo "=== Restarting services ==="
            docker compose up -d --no-deps backend celery-worker celery-beat nginx

            echo "=== Waiting for health check ==="
            sleep 10
            curl -f http://localhost/api/health/ || exit 1
            curl -f http://localhost/api/health/ready/ || exit 1

            echo "=== Deploy complete ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed. Check the logs above."
          # Add Slack/email notification here if needed
