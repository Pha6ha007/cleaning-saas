name: Security Checks

on:
  push:
    branches: [ main, develop, 'foundation/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run security tests
        run: |
          python -m pytest tests/ -m security -v --cov=apps --cov-report=term-missing
        env:
          PYTHONPATH: .
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///test.db
          DEBUG: "True"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: security-tests
          name: security-coverage

  bandit-scan:
    name: Bandit Security Linter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit==1.8.0

      - name: Run Bandit scan
        run: |
          bandit -c .bandit -r apps/ -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json

      - name: Check for high/critical issues
        run: |
          bandit -c .bandit -r apps/ --severity-level medium --exit-zero

  safety-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        run: pip install safety==3.6.2

      - name: Run Safety scan
        run: |
          safety check -r requirements.txt --json > safety-report.json || true

      - name: Upload Safety results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-vulnerability-report
          path: backend/safety-report.json

      - name: Check for vulnerabilities
        run: |
          safety check -r requirements.txt --exit-zero

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  all-checks-passed:
    name: All Security Checks Passed
    runs-on: ubuntu-latest
    needs: [security-tests, bandit-scan, safety-scan, codeql-analysis]
    if: always()

    steps:
      - name: Check if all jobs succeeded
        run: |
          if [ "${{ needs.security-tests.result }}" != "success" ] || \
             [ "${{ needs.bandit-scan.result }}" != "success" ] || \
             [ "${{ needs.safety-scan.result }}" != "success" ] || \
             [ "${{ needs.codeql-analysis.result }}" != "success" ]; then
            echo "❌ One or more security checks failed"
            exit 1
          else
            echo "✅ All security checks passed!"
          fi
